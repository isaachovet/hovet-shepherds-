<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thank You | Isaac &amp; Donia Hovet</title>
    <meta name="theme-color" content="#1B365D">
    <link rel="icon" type="image/png" href="images/standing-stone-icon-midnight.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
      .thank-you-page { min-height: 100vh; display: grid; place-items: center; padding: 2rem; color: var(--white); background: var(--midnight); }
      .thank-you-card { width: min(100%, 720px); padding: clamp(2rem, 7vw, 5rem); text-align: center; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.28); }
      .thank-you-card img { width: 300px; margin: 0 auto 3rem; }
      .thank-you-card h1 { max-width: none; font-size: clamp(3.5rem, 9vw, 6rem); }
      .thank-you-card p { margin: 1.5rem auto 2rem; color: var(--mist); font-size: 1.2rem; }
    </style>
  </head>
  <body class="thank-you-page">
    <main class="thank-you-card">
      <img src="images/standing-stone-wide-white.png" alt="Standing Stone Ministries Inc.">
      <p class="eyebrow light">Your note was sent</p>
      <h1>Thank you for reaching out.</h1>
      <p>We will read your message personally and respond as soon as we can.</p>
      <a class="button button-white" href="/">Return to the home page</a>
    </main>
  </body>
</html>
